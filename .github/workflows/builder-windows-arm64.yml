name: builder-windows-arm64
run-name: builder-windows-arm64 bot ${{ inputs.bot_index }}

on:
  workflow_dispatch:
    inputs:
      bot_index:
        description: Two-digit stable LUCI bot slot index
        type: string
        required: false
        default: "99"

permissions: {}
cache-mode: read

jobs:
  luci:
    runs-on: windows-11-arm
    environment: luci-builder-windows-arm64
    concurrency:
      group: builder-windows-arm64-${{ inputs.bot_index }}
      cancel-in-progress: false
    env:
      LLVM_MINGW_VERSION: "20250514"
      LLVM_MINGW_DIR: C:\llvm-mingw
      LLVM_MINGW_SHA256: d5b609a7f2857eac0c035e290a77012e177f58444f5cfa27c649d766c2d8c1d1
      BOOTSTRAPSWARM_SHA256: b4c2320e709afb5a0613e4f10017acb86cd795287aaa7b70e39f3e5934a9384f
      LUCI_BOT_HOSTNAME_PREFIX: windows-arm64-azure-qmuntal
      LUCI_MACHINE_TOKEND_SHA256: df1c5646ef5f9d41f2bd1e57ad0ba8acdb6e8d8c0dc70ee3cf382a7d60387697
      LUCI_MACHINE_TOKEN_BACKEND: luci-token-server.appspot.com
      LUCI_MACHINE_TOKEN_FILE: C:\luci_machine_tokend\token.json
      LUCI_TOOL_ROOT: C:\golang
      PYWIN32_VERSION: "312"
      PYWIN32_WHEEL_DIR: C:\pywin32-wheels
      SWARMING_USER: swarming
      SWARMING_WORKDIR: C:\b
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Set LUCI bot hostname
        timeout-minutes: 2
        env:
          BOT_INDEX: ${{ inputs.bot_index }}
        run: |
          $botIndex = $env:BOT_INDEX
          if ($botIndex -notmatch '\A[0-9]{2}\z') {
            Write-Error "bot_index must be exactly two ASCII digits, got '$botIndex'"
            exit 1
          }

          $botIndexNumber = [int]$botIndex
          if ($botIndexNumber -lt 1) {
            Write-Error "bot_index must be greater than zero, got '$botIndex'"
            exit 1
          }

          $hostname = "$env:LUCI_BOT_HOSTNAME_PREFIX--$botIndex"
          Add-Content -Path $env:GITHUB_ENV -Value "LUCI_BOT_HOSTNAME=$hostname"
          Write-Host "LUCI bot hostname: $hostname"

      - name: Create verified download helper
        timeout-minutes: 2
        run: |
          $scriptPath = Join-Path $env:RUNNER_TEMP "Save-VerifiedDownload.ps1"
          @'
          param(
            [Parameter(Mandatory = $true)] [string] $Uri,
            [Parameter(Mandatory = $true)] [string] $OutFile,
            [Parameter(Mandatory = $true)] [string] $Sha256
          )

          $ErrorActionPreference = "Stop"
          Write-Host "Downloading $Uri"
          Invoke-WebRequest -Uri $Uri -OutFile $OutFile -UseBasicParsing
          $actualHash = (Get-FileHash -Algorithm SHA256 -Path $OutFile).Hash.ToLowerInvariant()
          $expectedHash = $Sha256.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "$(Split-Path -Leaf $OutFile) SHA256 mismatch: got $actualHash, want $expectedHash"
          }
          '@ | Set-Content -Path $scriptPath -Encoding ASCII
          Add-Content -Path $env:GITHUB_ENV -Value "VERIFIED_DOWNLOAD_SCRIPT=$scriptPath"

      - name: Restore llvm-mingw toolchain
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        timeout-minutes: 10
        with:
          path: ${{ env.LLVM_MINGW_DIR }}
          key: llvm-mingw-windows-arm64-${{ env.LLVM_MINGW_VERSION }}-${{ env.LLVM_MINGW_SHA256 }}
          fail-on-cache-miss: true

      - name: Add llvm-mingw to PATH
        timeout-minutes: 2
        run: |
          $bin = Join-Path $env:LLVM_MINGW_DIR "bin"
          if (-not (Test-Path (Join-Path $bin "gcc.exe"))) {
            Write-Error "llvm-mingw gcc.exe not found in $bin"
            exit 1
          }

          # Put llvm-mingw at the front of PATH so its gcc/clang shadow
          # the x86-64 MinGW gcc that ships with Git for Windows. Also
          # update Machine PATH because the Swarming bot is started with
          # -UseNewEnvironment and will not inherit this step's process PATH.
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          $machinePath = [Environment]::GetEnvironmentVariable("PATH", [EnvironmentVariableTarget]::Machine)
          if (($machinePath -split ";") -notcontains $bin) {
            [Environment]::SetEnvironmentVariable("PATH", "$bin;$machinePath", [EnvironmentVariableTarget]::Machine)
          }
          $env:PATH = "$bin;$env:PATH"

          Write-Host "CC: $(gcc --version 2>&1 | Select-Object -First 1)"
          Write-Host "Target: $(gcc -dumpmachine)"

      - name: Remove known broken x86-64 tools
        timeout-minutes: 5
        run: |
          $knownDirs = @(
            "C:\Strawberry\c\bin", "C:\Strawberry\perl\bin",
            "$env:ProgramFiles\Git\usr\bin", "$env:ProgramFiles\Git\mingw64\bin"
          )
          foreach ($tool in @("gdb", "patch", "pkg-config")) {
            foreach ($cmd in Get-Command "$tool.exe" -CommandType Application -All -ErrorAction SilentlyContinue) {
              if ((Split-Path -Parent $cmd.Source) -notin $knownDirs) { continue }
              $pe = [System.Reflection.PortableExecutable.PEReader]::new([IO.File]::OpenRead($cmd.Source))
              try {
                $machine = $pe.PEHeaders.CoffHeader.Machine
              } finally {
                $pe.Dispose()
              }
              if ($machine -eq [System.Reflection.PortableExecutable.Machine]::Amd64) {
                Write-Host "Removing known x86-64 tool: $($cmd.Source)"
                Remove-Item -LiteralPath $cmd.Source -Force
              }
            }
          }

      - name: Locate Python
        id: python
        timeout-minutes: 2
        run: |
          $python = Get-Command python3.exe -CommandType Application -ErrorAction SilentlyContinue
          if (-not $python) {
            Write-Error "python3.exe is required for bootstrapswarm"
            exit 1
          }

          $version = & $python.Source -c "import platform; print(platform.python_version())"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $pythonDir = Split-Path -Parent $python.Source
          $machinePath = [Environment]::GetEnvironmentVariable("PATH", [EnvironmentVariableTarget]::Machine)
          if (($machinePath -split ";") -notcontains $pythonDir) {
            [Environment]::SetEnvironmentVariable("PATH", "$pythonDir;$machinePath", [EnvironmentVariableTarget]::Machine)
          }
          Add-Content -Path $env:GITHUB_ENV -Value "PYTHON_EXE=$($python.Source)"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Restore pywin32 wheels
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        timeout-minutes: 10
        with:
          path: ${{ env.PYWIN32_WHEEL_DIR }}
          key: pywin32-windows-arm64-${{ steps.python.outputs.version }}-${{ env.PYWIN32_VERSION }}
          fail-on-cache-miss: true

      - name: Install pywin32
        timeout-minutes: 5
        run: |
          & $env:PYTHON_EXE -m pip install --disable-pip-version-check --no-index --find-links "$env:PYWIN32_WHEEL_DIR" --only-binary=:all: "pywin32==$env:PYWIN32_VERSION"

      - name: Prepare swarming user
        timeout-minutes: 5
        run: |
          $swarmingPassword = "G0b!" + [Guid]::NewGuid().ToString("N") + "Aa1!"
          Write-Output "::add-mask::$swarmingPassword"
          $securePassword = ConvertTo-SecureString $swarmingPassword -AsPlainText -Force

          if (-not (Get-LocalUser -Name $env:SWARMING_USER -ErrorAction SilentlyContinue)) {
            Write-Host "Creating $env:SWARMING_USER user"
            New-LocalUser -Name $env:SWARMING_USER -Password $securePassword -PasswordNeverExpires -AccountNeverExpires
          } else {
            Write-Host "$env:SWARMING_USER user already exists"
            Set-LocalUser -Name $env:SWARMING_USER -Password $securePassword -PasswordNeverExpires $true
          }

          Write-Host "Granting SeCreateSymbolicLinkPrivilege to $env:SWARMING_USER"
          $swarmingSid = (Get-LocalUser -Name $env:SWARMING_USER).SID.Value
          @'
          import sys
          import win32security

          sid = win32security.ConvertStringSidToSid(sys.argv[1])
          policy = win32security.LsaOpenPolicy(None, win32security.POLICY_LOOKUP_NAMES | win32security.POLICY_CREATE_ACCOUNT)
          try:
              win32security.LsaAddAccountRights(policy, sid, ("SeCreateSymbolicLinkPrivilege",))
          finally:
              win32security.LsaClose(policy)
          '@ | & $env:PYTHON_EXE - $swarmingSid
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          New-Item -ItemType Directory -Force -Path $env:SWARMING_WORKDIR | Out-Null
          icacls $env:SWARMING_WORKDIR /setowner $env:SWARMING_USER
          icacls $env:SWARMING_WORKDIR /grant "${env:SWARMING_USER}:(OI)(CI)F"

          Add-Content -Path $env:GITHUB_ENV -Value "SWARMING_PASSWORD=$swarmingPassword"

          # Use the same login, clean Machine environment and workdir for
          # preflight and Swarming; neither should inherit runneradmin's PATH.
          $launcher = Join-Path $env:RUNNER_TEMP "Start-SwarmingProcess.ps1"
          @'
          param([string] $FilePath, [string[]] $ProcessArgs)
          $ErrorActionPreference = "Stop"
          $password = ConvertTo-SecureString $env:SWARMING_PASSWORD -AsPlainText -Force
          $credential = [pscredential]::new(".\$env:SWARMING_USER", $password)
          $process = Start-Process -FilePath $FilePath -ArgumentList $ProcessArgs `
            -Credential $credential -LoadUserProfile -UseNewEnvironment `
            -WorkingDirectory $env:SWARMING_WORKDIR -Wait -PassThru
          exit $process.ExitCode
          '@ | Set-Content -LiteralPath $launcher -Encoding ASCII
          Add-Content -Path $env:GITHUB_ENV -Value "SWARMING_LAUNCHER=$launcher"

      - name: Install LUCI builder tools
        timeout-minutes: 5
        run: |
          New-Item -ItemType Directory -Force -Path $env:LUCI_TOOL_ROOT | Out-Null
          $machinePath = [Environment]::GetEnvironmentVariable("PATH", [EnvironmentVariableTarget]::Machine)
          if (($machinePath -split ";") -notcontains $env:LUCI_TOOL_ROOT) {
            [Environment]::SetEnvironmentVariable("PATH", "$env:LUCI_TOOL_ROOT;$machinePath", [EnvironmentVariableTarget]::Machine)
          }
          & $env:VERIFIED_DOWNLOAD_SCRIPT `
            -Uri "https://storage.googleapis.com/go-builder-data/windows-arm64-luci_machine_tokend.exe" `
            -OutFile (Join-Path $env:LUCI_TOOL_ROOT "luci_machine_tokend.exe") `
            -Sha256 $env:LUCI_MACHINE_TOKEND_SHA256
          & $env:VERIFIED_DOWNLOAD_SCRIPT `
            -Uri "https://storage.googleapis.com/go-builder-data/windows-arm64-bootstrapswarm.exe" `
            -OutFile (Join-Path $env:LUCI_TOOL_ROOT "bootstrapswarm.exe") `
            -Sha256 $env:BOOTSTRAPSWARM_SHA256
          icacls $env:LUCI_TOOL_ROOT /grant "${env:SWARMING_USER}:(OI)(CI)RX"

      - name: Check prerequisites as the swarming user
        timeout-minutes: 2
        run: |
          $probe = Join-Path $env:LUCI_TOOL_ROOT "preflight.py"
          @'
          import subprocess
          import tempfile
          import win32security

          target = subprocess.check_output(["gcc.exe", "-dumpmachine"], text=True).strip()
          if target.split("-")[0].lower() not in ("aarch64", "arm64"):
              raise SystemExit(f"Expected an ARM64 compiler, got {target!r}")
          with tempfile.TemporaryFile(dir=".") as f:
              f.write(b"preflight")
          '@ | Set-Content -LiteralPath $probe -Encoding ASCII
          # Resolve python3.exe inside the clean child PATH, just as bootstrapswarm does.
          & $env:SWARMING_LAUNCHER -FilePath "$env:SystemRoot\System32\cmd.exe" `
            -ProcessArgs @("/d", "/c", "python3.exe `"$probe`"")
          if ($LASTEXITCODE -ne 0) { throw "Swarming preflight failed (exit $LASTEXITCODE): check python3, win32security, ARM64 gcc and workdir access" }

      - name: Mint LUCI machine token
        timeout-minutes: 5
        env:
          LUCI_BOT_CERT_PEM: ${{ vars.LUCI_BOT_CERT_PEM }}
          LUCI_BOT_KEY_PEM: ${{ secrets.LUCI_BOT_KEY_PEM }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:LUCI_BOT_CERT_PEM)) { Write-Error "LUCI_BOT_CERT_PEM variable is required"; exit 1 }
          if ([string]::IsNullOrWhiteSpace($env:LUCI_BOT_KEY_PEM)) { Write-Error "LUCI_BOT_KEY_PEM secret is required"; exit 1 }

          $luciRoot = Join-Path $env:RUNNER_TEMP "luci"
          $tokenDir = Split-Path -Parent $env:LUCI_MACHINE_TOKEN_FILE
          New-Item -ItemType Directory -Force -Path $luciRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $tokenDir | Out-Null
          icacls $tokenDir /grant "${env:SWARMING_USER}:(OI)(CI)RX"

          $certFile = Join-Path $luciRoot "hostname.cert"
          $keyFile = Join-Path $luciRoot "hostname.key"

          # GitHub variables/secrets may preserve real newlines or literal \n escapes; write normalized PEM files for tokend.
          $certPem = $env:LUCI_BOT_CERT_PEM.Trim().Replace("\r\n", "`n").Replace("\n", "`n").Replace("`r`n", "`n").Replace("`r", "`n").Trim() + "`n"
          $keyPem = $env:LUCI_BOT_KEY_PEM.Trim().Replace("\r\n", "`n").Replace("\n", "`n").Replace("`r`n", "`n").Replace("`r", "`n").Trim() + "`n"
          [System.IO.File]::WriteAllText($certFile, $certPem, [System.Text.Encoding]::ASCII)
          [System.IO.File]::WriteAllText($keyFile, $keyPem, [System.Text.Encoding]::ASCII)

          $tokenExitCode = 0
          try {
            & (Join-Path $env:LUCI_TOOL_ROOT "luci_machine_tokend.exe") `
              -backend $env:LUCI_MACHINE_TOKEN_BACKEND `
              -cert-pem $certFile `
              -pkey-pem $keyFile `
              -token-file $env:LUCI_MACHINE_TOKEN_FILE
            $tokenExitCode = $LASTEXITCODE
          } finally {
            Remove-Item -Path $certFile, $keyFile -Force -ErrorAction SilentlyContinue
          }
          if ($tokenExitCode -ne 0) {
            exit $tokenExitCode
          }

          icacls $env:LUCI_MACHINE_TOKEN_FILE /grant "${env:SWARMING_USER}:R"

      - name: Register LUCI builder
        # The minted LUCI machine token is valid for 60 minutes, so increasing
        # this timeout would not extend the usable bot lifetime.
        timeout-minutes: 60
        run: |
          # bootstrapswarm does not forward bot arguments. Set the environment
          # variable used by --one-shot so the bot exits after one real task.
          [Environment]::SetEnvironmentVariable("SWARMING_BOT_ONE_SHOT", "1", [EnvironmentVariableTarget]::Machine)
          [Environment]::SetEnvironmentVariable("SWARMING_NEVER_REBOOT", "true", [EnvironmentVariableTarget]::Machine)
          & $env:SWARMING_LAUNCHER -FilePath (Join-Path $env:LUCI_TOOL_ROOT "bootstrapswarm.exe") `
            -ProcessArgs @("-hostname", $env:LUCI_BOT_HOSTNAME)
          exit $LASTEXITCODE
