name: verify-dependency-pins

on:
  pull_request:
    paths:
      - .github/requirements-builder-windows-arm64.txt
      - .github/scripts/verify-builder-dependencies.py
      - .github/workflows/builder-windows-arm64.yml
      - .github/workflows/cache-windows-arm64.yml
      - .github/workflows/verify-dependency-pins.yml

permissions:
  contents: read

jobs:
  builder-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Verify builder pins and cache keys
        timeout-minutes: 2
        # Use Ubuntu's system Python with the distro-provided PyYAML.
        run: /usr/bin/python3 .github/scripts/verify-builder-dependencies.py